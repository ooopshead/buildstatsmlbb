<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLBB Pro Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <linearGradient id="grad-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e63"/><stop offset="0.55" stop-color="#b14dff"/><stop offset="1" stop-color="#22e0ff"/>
    </linearGradient>
  </defs>
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2Z"/><path d="M13 7l-4 6h3l-1 4 4-6h-3l1-4Z"/></symbol>
  <symbol id="i-heroes" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M20 20v-4"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v1a3 3 0 0 1-3 3M7 5H4v1a3 3 0 0 0 3 3"/><path d="M12 13v4M8 21h8M10 17h4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
</svg>
<div id="app">
  <!-- Header -->
  <div class="header">
    <h1 @click="goHome"><svg class="ico"><use href="#i-logo"/></svg>MLBB Pro Stats</h1>
    <input class="search" type="text" placeholder="Search hero..." v-model="search" v-show="view==='list'">
    <div class="tour-filter" style="margin-left:auto">
      <div class="header-btn" :class="{active: tourMenuOpen || !allToursSelected}" @click="tourMenuOpen=!tourMenuOpen">
        <svg class="ico"><use href="#i-trophy"/></svg> {{ tourBtnLabel }} <span style="opacity:.6">&#9662;</span>
      </div>
      <div v-if="tourMenuOpen" class="tour-backdrop" @click="tourMenuOpen=false"></div>
      <div v-if="tourMenuOpen" class="tour-menu">
        <div class="tour-menu-actions">
          <button @click="selectAllTours">All</button>
          <button @click="selectNoneTours">None</button>
        </div>
        <label v-for="t in tourList" :key="t.id" class="tour-opt">
          <input type="checkbox" :checked="selTourSet.has(t.id)" @change="toggleTour(t.id)">
          <span class="tour-opt-name">{{ t.name }}</span>
          <span class="tour-opt-count">{{ t.games }}</span>
        </label>
        <div v-if="!tourList.length" class="tour-empty">No tournaments loaded</div>
      </div>
    </div>
    <div class="header-btn" :class="{active: view==='list'||view==='hero'}" @click="goHome"><svg class="ico"><use href="#i-heroes"/></svg> Heroes</div>
    <div class="header-btn" :class="{active: view==='stats'}" @click="goStats"><svg class="ico"><use href="#i-stats"/></svg> Stats</div>
    <div class="header-btn" :class="{active: view==='matrix'}" @click="goMatrix"><svg class="ico"><use href="#i-grid"/></svg> Matrix</div>
    <div class="header-btn" :class="{active: view==='admin'}" @click="toggleAdmin">
      <svg class="ico"><use href="#i-gear"/></svg> Data
    </div>
  </div>

  <div class="container">
    <!-- HERO LIST VIEW -->
    <template v-if="view==='list'">
      <div class="filters">
        <label>Sort:</label>
        <select v-model="sortBy">
          <option value="games">Games ↓</option>
          <option value="wr">Winrate ↓</option>
          <option value="name">Name A-Z</option>
        </select>
        <label>Min games:</label>
        <input type="number" v-model.number="minGames" min="0" max="999" style="width:70px">
      </div>

      <div class="role-tabs">
        <button class="role-tab" :class="{active: roleFilter===''}" @click="roleFilter=''">All</button>
        <button v-for="r in roles" :key="r.key" class="role-tab"
                :class="{active: roleFilter===r.key}"
                :style="roleFilter===r.key ? {borderColor:r.color, background:r.color+'22', boxShadow:'0 0 14px '+r.color+'55'} : {}"
                @click="roleFilter = roleFilter===r.key ? '' : r.key">
          <span class="role-dot" :style="{background:r.color}"></span>{{ r.key }}
          <span class="role-count">{{ roleCounts[r.key]||0 }}</span>
        </button>
      </div>

      <div class="hero-grid" :class="{'role-tinted': roleFilter}" :style="roleFilter ? {'--tile-c': roleColor(roleFilter)} : null">
        <div class="hero-tile" v-for="h in filteredHeroes" :key="h.slug"
             @click="openHero(h)" :class="{'no-data': h.games===0}">
          <img :src="h.portrait" :alt="h.name" loading="lazy"
               @error="if(!$event.target.dataset.fb){$event.target.dataset.fb=1;$event.target.src='img/heroes/unknown.png'}">
          <div class="name">{{ h.name }}</div>
          <div class="stats" v-if="h.games > 0">
            {{ h.games }}g &bull;
            <span :class="wrClass(h.wr)">{{ (h.wr*100).toFixed(1) }}%</span>
          </div>
          <div class="stats" v-else>No data</div>
          <div class="tile-roles" v-if="h.roles.length">
            <span v-for="r in h.roles" :key="r" class="role-badge"
                  :style="{color:roleColor(r), borderColor:roleColor(r)+'66', background:roleColor(r)+'1f'}">{{ r }}</span>
          </div>
        </div>
      </div>
    </template>

    <!-- STATS LEADERBOARD VIEW -->
    <template v-if="view==='stats'">
      <div class="filters">
        <div class="section-title" style="margin:0"><svg class="ico"><use href="#i-stats"/></svg> Hero Combat Stats</div>
        <span style="flex:1"></span>
        <label>Min games:</label>
        <input type="number" v-model.number="statMinGames" min="0" max="999" style="width:70px">
      </div>
      <div class="stats-hint">
        Counts (K/D/A, DMG, TKN) are per-game averages. Ratios (KDA, D/G, D%, TKN/D) are pooled.
        Combat data comes from JSON tournaments only (xls has none). Click a row for hero detail.
      </div>
      <div class="table-scroll">
        <table class="data-table stat-table">
          <thead>
            <tr>
              <th @click="sortStats('name')" :class="statCls('name')">Hero</th>
              <th @click="sortStats('games')" :class="statCls('games')" title="Games">G</th>
              <th @click="sortStats('wr')" :class="statCls('wr')" title="Winrate">WR</th>
              <th @click="sortStats('k')" :class="statCls('k')" title="Avg kills / game">K</th>
              <th @click="sortStats('d')" :class="statCls('d')" title="Avg deaths / game">D</th>
              <th @click="sortStats('a')" :class="statCls('a')" title="Avg assists / game">A</th>
              <th @click="sortStats('kda')" :class="statCls('kda')" title="(sum K + sum A) / sum D">KDA</th>
              <th @click="sortStats('dmg')" :class="statCls('dmg')" title="Avg hero damage / game">DMG</th>
              <th @click="sortStats('dpm')" :class="statCls('dpm')" title="Damage per minute">DPM</th>
              <th @click="sortStats('dmg_gold')" :class="statCls('dmg_gold')" title="Damage per gold">D/G</th>
              <th @click="sortStats('dmg_share')" :class="statCls('dmg_share')" title="% of team damage">D%</th>
              <th @click="sortStats('dtaken')" :class="statCls('dtaken')" title="Avg damage taken / game">TKN</th>
              <th @click="sortStats('dt_death')" :class="statCls('dt_death')" title="Damage taken per death">TKN/D</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="r in statRows" :key="r.slug" @click="openHero(r)" style="cursor:pointer">
              <td class="hero-cell">
                <img class="icon" :src="r.portrait" :alt="r.name" loading="lazy"
                     @error="if(!$event.target.dataset.fb){$event.target.dataset.fb=1;$event.target.src='img/heroes/unknown.png'}">
                <span>{{ r.name }}</span>
              </td>
              <td>{{ r.games }}</td>
              <td><span class="wr" :class="wrClass(r.wr)">{{ (r.wr*100).toFixed(1) }}%</span></td>
              <td>{{ fmt1(r.k) }}</td>
              <td>{{ fmt1(r.d) }}</td>
              <td>{{ fmt1(r.a) }}</td>
              <td><b>{{ fmt2(r.kda) }}</b></td>
              <td>{{ fmtK(r.dmg) }}</td>
              <td>{{ fmtInt(r.dpm) }}</td>
              <td>{{ fmtPct(r.dmg_gold) }}</td>
              <td>{{ fmtPct(r.dmg_share) }}</td>
              <td>{{ fmtK(r.dtaken) }}</td>
              <td>{{ fmtK(r.dt_death) }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div v-if="!statRows.length" style="color:var(--text2);padding:24px;text-align:center">
        No heroes with combat data at this threshold. Lower "Min games", or rebuild with JSON tournaments.
      </div>
    </template>

    <!-- MATCHUP MATRIX VIEW -->
    <template v-if="view==='matrix'">
      <div class="filters">
        <div class="section-title" style="margin:0"><svg class="ico"><use href="#i-grid"/></svg> Matchup Matrix</div>
        <span style="flex:1"></span>
        <label>Duration:</label>
        <div class="mx-seg">
          <button :class="{active: matrixBucket===-1}" @click="matrixBucket=-1">All</button>
          <button v-for="(b,i) in durBuckets" :key="i" :class="{active: matrixBucket===i}" @click="matrixBucket=i">{{ b.label }}</button>
        </div>
        <label>Min games:</label>
        <input type="number" v-model.number="matrixMinGames" min="1" max="999" style="width:64px">
        <label class="dur-toggle"><input type="checkbox" v-model="matrixShowVals"> Show %</label>
      </div>

      <div class="mx-legend">
        <span>Cell = <b>row hero</b>'s win rate vs <b>column hero</b> (games where the column hero was on the enemy team).</span>
        <span class="mx-scale"><i>Col favored</i><span class="mx-bar"></span><i>Row favored</i></span>
        <span class="mx-note">Faded = few games &middot; empty = never met (N/A)</span>
      </div>

      <div class="mx-wrap" @mousemove="onMatrixMove" @mouseleave="onMatrixLeave">
        <table class="mx-table">
          <thead>
            <tr>
              <th class="mx-corner">vs &rarr;</th>
              <th v-for="c in matrixHeroes" :key="c.slug" class="mx-colhead" :title="c.name">
                <img :src="c.portrait" :alt="c.name" loading="lazy"
                     @error="if(!$event.target.dataset.fb){$event.target.dataset.fb=1;$event.target.src='img/heroes/unknown.png'}">
              </th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="row in matrixGrid" :key="row.slug">
              <th class="mx-rowhead" :title="row.name">
                <img :src="row.portrait" :alt="row.name" loading="lazy"
                     @error="if(!$event.target.dataset.fb){$event.target.dataset.fb=1;$event.target.src='img/heroes/unknown.png'}">
                <span class="mx-rowname">{{ row.name }}</span>
              </th>
              <td v-for="(cell, ci) in row.cells" :key="ci"
                  :data-r="row.slug" :data-c="cell.slug"
                  :class="{'mx-diag': cell.diag, 'mx-na': cell.na}"
                  :style="cell.bg ? {background: cell.bg} : null">
                <span v-if="matrixShowVals && cell.v!=null">{{ cell.v }}</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div v-if="!matrixHeroes.length" style="color:var(--text2);padding:24px;text-align:center">
        No heroes with &ge; {{ matrixMinGames }} games. Lower the threshold.
      </div>

      <div class="mx-tooltip" v-if="hoverCell" :style="{left: hoverCell.x+'px', top: hoverCell.y+'px'}">
        <div class="mx-tt-title">{{ hoverCell.row }} <span style="color:var(--text2)">vs</span> {{ hoverCell.col }}</div>
        <div class="mx-tt-wr" :class="hoverCell.cell.wr>=0.5?'wr-high':'wr-low'">{{ (hoverCell.cell.wr*100).toFixed(1) }}%</div>
        <div class="mx-tt-sub">{{ hoverCell.cell.w }}W &ndash; {{ hoverCell.cell.l }}L &middot; {{ hoverCell.cell.g }} games</div>
      </div>
    </template>

    <!-- HERO DETAIL VIEW -->
    <template v-if="view==='hero' && hero">
      <div class="back-btn" @click="goHome"><svg class="ico"><use href="#i-back"/></svg> Back to heroes</div>

      <div class="hero-header">
        <img :src="hero.portrait" :alt="hero.name"
             @error="if(!$event.target.dataset.fb){$event.target.dataset.fb=1;$event.target.src='img/heroes/unknown.png'}">
        <div class="info">
          <h2>{{ hero.name }}</h2>
          <div class="baseline">
            {{ aggregated.total_games }}g &bull;
            {{ aggregated.wins }}W/{{ aggregated.total_games - aggregated.wins }}L &bull;
            <span class="wr" :class="wrClass(aggregated.wr)">{{ (aggregated.wr*100).toFixed(1) }}%</span> WR
            <span v-if="dateFrom || dateTo" style="color:var(--text2);font-size:12px;margin-left:6px">
              (filtered from {{ hero.total_games }}g)
            </span>
          </div>
          <div class="baseline-dur" v-if="aggregated.total_games">
            <span class="bd-title">WR by length:</span>
            <span v-for="(b,i) in durBuckets" :key="i" class="dur-chip">
              <span class="dur-chip-label">{{ b.label }}</span>
              <span class="dur-chip-wr" :class="durWr(heroDur,i)==null?'':wrClass(durWr(heroDur,i))">{{ durWrFmt(heroDur,i) }}</span>
              <span class="dur-chip-g">{{ durG(heroDur,i) }}g</span>
            </span>
          </div>
        </div>
      </div>

      <!-- Date filter -->
      <div class="date-filter">
        <label>Date:</label>
        <input type="date" v-model="dateFrom" :min="dateMin" :max="dateMax">
        <span class="dash">—</span>
        <input type="date" v-model="dateTo" :min="dateMin" :max="dateMax">
        <div class="date-presets">
          <button class="date-preset" @click="setDatePreset('all')"
                  :class="{active: !dateFrom && !dateTo}">All</button>
          <button class="date-preset" @click="setDatePreset('7d')">Last 7d</button>
          <button class="date-preset" @click="setDatePreset('14d')">Last 14d</button>
          <button class="date-preset" @click="setDatePreset('30d')">Last 30d</button>
        </div>
        <span class="date-range-hint" v-if="dateMin">
          available: {{ dateMin }} → {{ dateMax }}
        </span>
      </div>

      <div v-if="aggregated.total_games===0" style="background:var(--card);padding:20px;border-radius:var(--radius);text-align:center;color:var(--text2);margin-bottom:16px">
        No matches in selected date range.
      </div>

      <!-- Matchup filter -->
      <div class="date-filter" style="margin-bottom:12px">
        <label>vs Hero:</label>
        <select v-model="enemyFilter" style="padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;min-width:180px">
          <option value="">All opponents</option>
          <option v-for="e in enemyCounts" :key="e.name" :value="e.name">
            {{ e.name }} ({{ e.games }}g)
          </option>
        </select>
        <span v-if="enemyFilter" style="font-size:12px;color:var(--text2)">
          → {{ aggregated.total_games }}g vs {{ enemyFilter }}
        </span>
        <button v-if="enemyFilter" class="date-preset" @click="enemyFilter=''">Clear</button>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab" :class="{active: tab==='stats'}" @click="tab='stats'">Stats</div>
        <div class="tab" :class="{active: tab==='items'}" @click="tab='items'">Items</div>
        <div class="tab" :class="{active: tab==='combos'}" @click="tab='combos'">Builds</div>
        <div class="tab" :class="{active: tab==='emblems'}" @click="tab='emblems'">Emblems</div>
        <div class="tab" :class="{active: tab==='talents'}" @click="tab='talents'">Talents</div>
        <div class="tab" :class="{active: tab==='emb_tal'}" @click="tab='emb_tal'">Emblem+Talents</div>
        <div class="tab" :class="{active: tab==='spells'}" @click="tab='spells'">Battle Spells</div>
        <div class="tab" :class="{active: tab==='matchups'}" @click="tab='matchups'">Matchups</div>
        <div class="tab" :class="{active: tab==='players'}" @click="tab='players'">Players</div>
      </div>

      <!-- Combat-metric selector (adds one column to the tables below) -->
      <div class="metric-bar" v-if="['items','combos','emblems','talents','emb_tal','spells'].includes(tab)">
        <label>Combat stat:</label>
        <select v-model="metric">
          <option value="">&mdash; none &mdash;</option>
          <option v-for="m in metrics" :key="m.key" :value="m.key">{{ m.label }}</option>
        </select>
        <label class="dur-toggle"><input type="checkbox" v-model="showDur"> WR by game length</label>
        <span class="metric-hint" v-if="metric">
          combat: counts = avg/game, ratios pooled
        </span>
        <span class="metric-hint" v-if="showDur">
          WR split by match duration (games shown under each %)
        </span>
      </div>

      <!-- STATS TAB -->
      <div v-if="tab==='stats'" class="section">
        <div v-if="!heroCombat" style="background:var(--card);padding:20px;border-radius:var(--radius);text-align:center;color:var(--text2)">
          No combat data for the selected matches. These metrics exist only in JSON tournaments (xls exports have none).
        </div>
        <div v-else>
          <div class="stat-cards">
            <div class="stat-card">
              <div class="sc-label">KDA</div>
              <div class="sc-val" :class="heroCombat.kda>=4?'wr-high':(heroCombat.kda>=2.5?'wr-mid':'wr-low')">{{ fmt2(heroCombat.kda) }}</div>
              <div class="sc-sub">{{ fmt1(heroCombat.k) }} / {{ fmt1(heroCombat.d) }} / {{ fmt1(heroCombat.a) }} avg</div>
            </div>
            <div class="stat-card">
              <div class="sc-label">Damage</div>
              <div class="sc-val">{{ fmtInt(heroCombat.dmg) }}</div>
              <div class="sc-sub">avg / game</div>
            </div>
            <div class="stat-card">
              <div class="sc-label">Damage / min</div>
              <div class="sc-val">{{ fmtInt(heroCombat.dpm) }}</div>
              <div class="sc-sub">pooled</div>
            </div>
            <div class="stat-card">
              <div class="sc-label">Damage / gold</div>
              <div class="sc-val">{{ fmtPct(heroCombat.dmg_gold) }}</div>
              <div class="sc-sub">pooled</div>
            </div>
            <div class="stat-card">
              <div class="sc-label">% of team damage</div>
              <div class="sc-val">{{ fmtPct(heroCombat.dmg_share) }}</div>
              <div class="sc-sub">pooled</div>
            </div>
            <div class="stat-card">
              <div class="sc-label">Damage taken</div>
              <div class="sc-val">{{ fmtInt(heroCombat.dtaken) }}</div>
              <div class="sc-sub">avg / game</div>
            </div>
            <div class="stat-card">
              <div class="sc-label">Taken / death</div>
              <div class="sc-val">{{ fmtInt(heroCombat.dt_death) }}</div>
              <div class="sc-sub">pooled</div>
            </div>
            <div class="stat-card">
              <div class="sc-label">K / D / A</div>
              <div class="sc-val">{{ fmt1(heroCombat.k) }} / {{ fmt1(heroCombat.d) }} / {{ fmt1(heroCombat.a) }}</div>
              <div class="sc-sub">avg / game</div>
            </div>
          </div>
          <div class="stats-hint" style="margin-top:14px">
            Based on {{ heroCombat.n }} game(s) with combat data<span v-if="heroCombat.n < aggregated.total_games"> (of {{ aggregated.total_games }} shown — the rest come from xls without combat stats)</span>.
            Counts are per-game averages; ratios are pooled. Respects the date &amp; matchup filters above.
          </div>
        </div>
      </div>

      <!-- ITEMS TAB -->
      <div v-if="tab==='items'" class="section">
        <table class="data-table">
          <thead>
            <tr>
              <th></th>
              <th @click="sortItems('name')">Item</th>
              <th @click="sortItems('wr')">WR</th>
              <template v-if="showDur"><th v-for="(b,i) in durBuckets" :key="'dh'+i" class="dur-th" :title="'WR in '+b.label+' games'">{{ b.label }}</th></template>
              <th @click="sortItems('games')">Games</th>
              <th v-if="metric" @click="sortItems('mv')" class="metric-th">{{ metricLabel }}</th>
              <th>vs base</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="it in sortedItems" :key="it.name">
              <td><img class="icon" :src="itemIconByName(it.name)"
                       @error="$event.target.style.display='none'"></td>
              <td>{{ it.name }}</td>
              <td class="wr" :class="wrClass(it.wr)">{{ (it.wr*100).toFixed(1) }}%</td>

          </div>

            <input type="text" v-model="cfgUid" placeholder="299" class="admin-input" style="width:80px">

        </div>
        <div v-if="configMsg" class="admin-msg" style="margin-top:8px">{{ configMsg }}</div>

          <div>
            <label style="font-size:12px;color:var(--text2)">Tournament ID</label>

            <input type="date" v-model="fetchStartDate" class="admin-input">

        <div v-if="fetchMsg" class="admin-msg" :class="{error: fetchError}">{{ fetchMsg }}</div>

          <div v-else>Uploading...</div>

          </tbody>
        </table>
        <div v-else style="color:var(--text2);padding:16px">No tournament files loaded.</div>
      </div>

      <!-- Rebuild -->
      <div class="admin-section">
        <div class="section-title">Rebuild Statistics</div>
        <p style="color:var(--text2);font-size:13px;margin-bottom:10px">
          Re-processes all tournament data and regenerates hero statistics.
        </p>
        <button class="btn-rebuild" @click="rebuild" :disabled="rebuilding">
          {{ rebuilding ? 'Rebuilding...' : 'Rebuild All Stats' }}
        </button>
        <pre v-if="rebuildOutput" class="rebuild-output">{{ rebuildOutput }}</pre>
      </div>
    </template>

    <!-- Loading -->
    <div v-if="loading" style="text-align:center;padding:40px;color:var(--text2)">
      <span class="loading-spin"></span>Loading...
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="app.js"></script>
</body>
</html>
